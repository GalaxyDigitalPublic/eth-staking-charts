{{/*
Shared engine-API JWT for the EL/CL pair.

Generated once and then read back with `lookup` on every subsequent render. Without
the lookup, each reconcile would mint a new secret and restart both clients.
*/}}
{{- $name := printf "%s-jwt" (include "eth-rpc-node.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "jwt.hex") }}
{{- $jwt = index $existing.data "jwt.hex" | b64dec }}
{{- else }}
{{- $jwt = randAlphaNum 32 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
{{ include "eth-rpc-node.labels" . | indent 4 }}
type: Opaque
stringData:
  jwt.hex: {{ $jwt | quote }}
