{{/*
Keymanager API token, generated by the chart (keyManagerApi.tokenSecret.generate). Random on first install, then
read back with `lookup` on every render so it never changes (same pattern as eth-rpc-node's JWT). Lighthouse >= 5 takes
any random Bearer token; `privateKey` (Lighthouse's old .secp-sk) is random too because the StatefulSet mounts it.
Not backed up by Velero: a restored release just generates a new token (roll the token's consumers).
*/}}
{{- $ts := .Values.keyManagerApi.tokenSecret }}
{{- if and .Values.keyManagerApi.enabled $ts.name $ts.generate }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $ts.name }}
{{- $token := "" }}
{{- $secret := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $ts.publicKey) }}
{{- $token = index $existing.data $ts.publicKey | b64dec }}
{{- if and $ts.privateKey (hasKey $existing.data $ts.privateKey) }}
{{- $secret = index $existing.data $ts.privateKey | b64dec }}
{{- end }}
{{- else }}
{{- $token = randAlphaNum 64 | sha256sum }}
{{- end }}
{{- if and $ts.privateKey (not $secret) }}
{{- $secret = randAlphaNum 64 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ts.name }}
  labels:
    {{- include "validators.labels" . | nindent 4 }}
    velero.io/exclude-from-backup: "true"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $ts.publicKey }}: {{ $token | quote }}
  {{- if $ts.privateKey }}
  {{ $ts.privateKey }}: {{ $secret | quote }}
  {{- end }}
{{- end }}
