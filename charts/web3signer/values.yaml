# Default values for web3signer.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  serviceAccount:
    create: true

replicaCount: 3

image:
  registry: "docker.io"
  repository: consensys/web3signer
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

## Database connection string, ex. 'postgresql://username:pass@hostname/dbname'
##
dbKeystoreUrl: ""

## Database table name for validator keys (sync-keys 0.4.0+).
## When set, passes --table-name to sync-web3signer-keys.
## Leave empty to use the tool's default table name.
##
dbKeystoreTableName: ""

## NOTE: the fetch-keys init container below still defaults to sync-keys 0.4.1, which does not
## understand the options here. A release that sets any of them must also pin
## initContainers[fetch-keys].image.tag to 0.4.2 or newer. The default is deliberately left
## alone: every release pins a chart version, so changing it would not affect anyone
## immediately, but it would silently bundle a sync-keys upgrade into whichever release next
## adopts this chart version. Image bumps should be their own decision.
##
## When that default does move, a namespace whose keystore query returns no rows needs
## dbKeystoreAllowNoKeys in the same change, or its init container will fail. QA's
## euw1/hoodi-2 is one such namespace.
##
## Restrict fetched keys to these clusters. Required when the keystore table carries a
## client_cluster_id column, because that table holds more than one cluster's keys and
## sync-keys otherwise refuses to run. Leave empty for the agent-managed table, which has no
## such column.
##
## A list, because one signer can legitimately serve several clusters. Naming them is
## preferable to dbKeystoreAllClusters: the set is closed, so a cluster added to the same
## database later is not served unless it is added here.
dbKeystoreClientClusterIds: []
## Deliberately load every cluster's keys from a cluster-scoped table. Only correct when this
## signer really does serve every cluster in that table, including ones added later. Prefer
## naming the clusters. Mutually exclusive with dbKeystoreClientClusterIds.
dbKeystoreAllClusters: false
## Start with an empty keystore when the keystore table returns no rows, instead of failing
## the init container. Set this only for a signer that is deployed but serves no validators
## yet; otherwise a wrong cluster id or an unpopulated table should stop the pod rather than
## bring up a signer that cannot sign.
dbKeystoreAllowNoKeys: false

## The key for decrypting private keys is generated with stakewise-cli sync-db command
## Use this for plain text decryption key (legacy mode)
##
decryptionKey: ""

## Encrypted decryption key — decrypts at runtime via AWS KMS or Azure Key Vault.
## Decrypted key is stored in a memory-backed volume (never on disk).
encryptedDecryptionKey:
  enabled: false
  ciphertext: ""
  provider: "aws"  # "aws" or "azure"

  aws:
    region: "us-east-1"
    keyId: ""
    roleArn: ""

  ## Fetch secrets from Azure KV at runtime (Azure provider only).
  ## Queries AES ciphertext from KOS DB, fetches DB password + keystore URL from KV.
  useKeyVaultSecrets: false
  clientClusterId: ""       # encrypted_encryption_keys lookup key
  keyVaultSecrets:
    dbPassword: ""          # KV secret name
    dbKeystoreUrl: ""       # KV secret name

  azure:
    vaultName: ""
    keyName: ""
    keyVersion: ""
    algorithm: "RSA-OAEP-256"
    clientId: ""

  awsImage:
    registry: "docker.io"
    repository: "amazon/aws-cli"
    tag: "latest"
    pullPolicy: Always
  azureImage:
    registry: "mcr.microsoft.com"
    repository: "azure-cli"
    tag: "latest"
    pullPolicy: Always

## Flyawy image is used to apply database migrations
##
flywayImage:
  registry: "docker.io"
  repository: flyway/flyway
  tag: "10-alpine"
  pullPolicy: Always

imagePullSecrets: []

## Provide a name in place of operator for `app:` labels
##
nameOverride: ""

## Provide a name to substitute for the full names of resources
##
fullnameOverride: ""

## Web3Signer Settings
## ref: https://docs.web3signer.consensys.net/en/latest/Reference/CLI/CLI-Syntax/
##

## Network
## Options: mainnet, prater, gnosis
network: "mainnet"

## Sets logging verbosity.
## Log levels are OFF, FATAL, WARN, INFO, DEBUG, TRACE, ALL.
loggingLevel: "INFO"

## Number of epochs to keep when pruning the slashing protection database.
##
pruningEpochToKeep: 100

## Hours between slashing protection database pruning operations.
##
pruningInterval: 24

## Number of slots per epoch. This number multiplied by the number of epochs to keep determines what blocks to keep when pruning the slashing protection database.
## The default is 32 as defined on MainNet/Prater.
##
slotsPerEpoch: 32

## The Java Database Connectivity (JDBC) URL of the slashing protection database.
##
dbUrl: "jdbc:postgresql://localhost/web3signer"

## The username to use when connecting to the slashing protection database.
##
dbUsername: ""

## The password to connect to the slashing protection database.
## Use dbPassword for plain text (not recommended) or existingSecrets for production.
##
dbPassword: ""

## Use existing Kubernetes secrets instead of passing values directly.
## This is the recommended approach for production deployments.
## When set, the corresponding plain text values above are ignored.
##
existingSecrets:
  ## Database password secret
  dbPassword:
    ## Name of existing secret containing the database password
    name: ""
    ## Key within the secret
    key: "password"
  ## Decryption key secret (for decrypting validator keys from keystore DB)
  decryptionKey:
    ## Name of existing secret containing the decryption key
    name: ""
    ## Key within the secret
    key: "decryptionKey"
  ## Keystore database URL secret (postgresql://user:pass@host/db format)
  dbKeystoreUrl:
    ## Name of existing secret containing the full keystore DB URL
    name: ""
    ## Key within the secret
    key: "dbKeystoreUrl"

## Port on which Web3Signer HTTP listens.
##
httpPort: 6174

## The port (TCP) on which Prometheus accesses metrics
##
metricsPort: 9000

## Java Opts
##
web3signerJavaOpts: "-Xmx1g -Xms1g"

## Enables the key manager API.
##
keyManagerApiEnabled: "false"

## Override the container command (if specified, overrides Docker ENTRYPOINT)
## Leave empty to use the default Docker ENTRYPOINT: ["/opt/web3signer/bin/web3signer"]
##
command: []

## Override the container args (if specified, overrides the default args)
##
args:
  - --config-file=/config/config.yaml
  - eth2
  - --slashing-protection-pruning-at-boot-enabled=true

## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
##
serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

## Pod labels to add
podLabels: {}

## Pod Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
##
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

## Configure resource requests and limits.
## ref: http://kubernetes.io/docs/user-guide/compute-resources/
##
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Node labels for pod assignment
## ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}

## Tolerations for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: {}

## Affinity for pod assignment
## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
##
affinity: {}

## Topology spread constraints for pod assignment
## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
## ## !!Ensure labelSelector is set to match pod labels.
## Example:
## topologySpreadConstraints:
## - maxSkew: 1
##   topologyKey: kubernetes.io/hostname
##   whenUnsatisfiable: ScheduleAnyway
##   labelSelector:
##     matchLabels:
##       app.kubernetes.io/name: web3signer
##       app.kubernetes.io/instance: web3signer

# topologySpreadConstraints: []

## Pod management policy for the StatefulSet
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#pod-management-policies
## Options: OrderedReady (default), Parallel
##

# podManagementPolicy: OrderedReady

## Update strategy for the StatefulSet
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
## Set rollingUpdate.partition to limit updates to pods with an ordinal >= partition
## (useful for canary/staged rollouts — pods below the partition are not updated)
##

# updateStrategy:
#  rollingUpdate:
#    partition: 0

## Prometheus Service Monitor
## ref: https://github.com/coreos/prometheus-operator
##      https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
##
serviceMonitor:
  ## @param metrics.serviceMonitor.enabled Create ServiceMonitor resource(s) for scraping metrics using PrometheusOperator
  ##
  enabled: false
  ## @param metrics.serviceMonitor.namespace The namespace in which the ServiceMonitor will be created
  ##
  namespace: ""
  ## @param metrics.serviceMonitor.interval The interval at which metrics should be scraped
  ##
  interval: 30s
  ## @param metrics.serviceMonitor.scrapeTimeout The timeout after which the scrape is ended
  ##
  scrapeTimeout: ""
  ## @param metrics.serviceMonitor.relabellings Metrics RelabelConfigs to apply to samples before scraping.
  ##
  relabellings: []
  ## @param metrics.serviceMonitor.metricRelabelings Metrics RelabelConfigs to apply to samples before ingestion.
  ##
  metricRelabelings: []
  ## @param metrics.serviceMonitor.honorLabels Specify honorLabels parameter to add the scrape endpoint
  ##
  honorLabels: false
  ## @param metrics.serviceMonitor.additionalLabels Additional labels that can be used so ServiceMonitor resource(s) can be discovered by Prometheus
  ##
  additionalLabels: {}

## Ingress configuration
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## Enable ingress resource
  enabled: false

  ## Ingress class name (e.g., "nginx", "azure-application-gateway")
  className: "nginx"

  ## Additional annotations for the ingress resource
  annotations: {}

  ## Request timeout in seconds (for NGINX ingress)
  requestTimeout: "60"

  ## Ingress hosts configuration
  hosts:
    - host: web3signer.internal
      paths:
        - path: /
          pathType: Prefix

  ## TLS configuration for HTTPS
  ## Each entry should have hosts (list) and secretName
  tls: []
  # - hosts:
  #     - web3signer.internal
  #   secretName: web3signer-server-tls

  ## mTLS configuration for client certificate verification
  ## Only supported with NGINX ingress controller
  mtls:
    ## Enable mTLS client certificate verification
    enabled: false

    ## CA secret for verifying client certificates
    ## Format: "namespace/secret-name"
    caSecret: "cert-manager/mtls-ca-secret"

    ## Client verification mode:
    ## - "on": require valid client certificate
    ## - "optional": request but don't require client certificate
    ## - "optional_no_ca": request certificate but don't verify against CA
    verifyClient: "on"

    ## Certificate chain verification depth
    verifyDepth: "1"

## Certificate configuration (requires cert-manager)
## Creates a Certificate resource for server TLS
##
certificate:
  ## Enable automatic certificate generation via cert-manager
  enabled: false

  ## Name of the Kubernetes secret to store the certificate
  secretName: "web3signer-server-tls"

  ## Certificate duration (default: 1 year)
  duration: "8760h"

  ## Time before expiry to renew (default: 30 days)
  renewBefore: "720h"

  ## Organization name in the certificate subject
  organization: "Galaxy"

  ## DNS names to include in the certificate
  ## If empty, defaults to service name variants
  dnsNames: []
  # - web3signer.internal.example.com

  ## Private key configuration
  privateKey:
    algorithm: "ECDSA"
    size: 256

  ## Reference to the cert-manager issuer
  issuerRef:
    name: "mtls-ca-issuer"
    kind: "ClusterIssuer"

# Init containers — this list completely replaces the defaults when overridden.
# Containers with usesDecryptedSecret: true get a shell wrapper that exports
# DECRYPTION_KEY (and DB_PASSWORD/DB_KEYSTORE_URL in KV mode) from /decrypted-secrets/.
initContainers:
  - name: init
    image:
      registry: "docker.io"
      repository: busybox
      tag: "stable"
      pullPolicy: Always
    securityContext:
      runAsUser: 0
    command:
      - sh
      - -ac
      - >
        mkdir -p /data/web3signer /data/keystore;
        chown -R 1000:1000 /data/web3signer /data/keystore
    volumeMounts:
      - name: data
        mountPath: /data

  - name: fetch-keys
    usesDecryptedSecret: true
    image:
      registry: "ghcr.io"
      repository: "galaxydigitalpublic/sync-keys"
      tag: "0.4.1"
      pullPolicy: Always
    workingDir: /src
    command:
      - python
      - ./main.py
    args:
      - sync-web3signer-keys
      - --db-url
      - "{{ .Values.dbKeystoreUrl }}"
      - --output-dir
      - /data/keystore
    envFrom:
      - secretRef:
          name: '{{ include "common.names.fullname" . }}'
    volumeMounts:
      - name: data
        mountPath: /data

  - name: copy-migrations
    command:
      - sh
      - -ac
      - cp -v /opt/web3signer/migrations/postgresql/* /migrations/
    volumeMounts:
      - name: migrations
        mountPath: /migrations

  - name: migrations
    usesDecryptedSecret: true
    image:
      registry: "docker.io"
      repository: flyway/flyway
      tag: "10-alpine"
      pullPolicy: Always
    securityContext:
      runAsUser: 0
    command:
      - flyway
    args:
      - "-user={{ .Values.dbUsername }}"
      - "-url={{ .Values.dbUrl }}"
      - "-locations=filesystem:/migrations"
      - "migrate"
    volumeMounts:
      - name: migrations
        mountPath: /migrations
